                <div className="lg:col-span-7">
                  <div className={`p-6 sm:p-8 rounded-2xl border ${darkMode ? 'bg-slate-900/60 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                    <h4 className="text-lg font-bold mb-4">Send a Direct Inquiry</h4>
                    {formStatus === 'success' ? (
                      <div className="p-6 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-center space-y-2">
                        <Icon name="checkCircle" className="w-8 h-8 mx-auto text-emerald-400" />
                        <h5 className="font-bold text-base">Message Transmitted!</h5>
                        <p className="text-xs text-emerald-300">Thank you for getting in touch. Daud will respond promptly.</p>
                      </div>
                    ) : (
                      <form onSubmit={handleContactSubmit} className="space-y-4 text-xs">
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block mb-1.5 font-medium text-slate-400">Your Name</label>
                            <input type="text" required value={contactName} onChange={(e) => setContactName(e.target.value)} placeholder="Full Name" className={`w-full px-3 py-2.5 rounded-lg border outline-none ${darkMode ? 'bg-slate-950 border-slate-800 text-slate-100' : 'bg-white border-slate-300 text-slate-900'}`} />
                          </div>
                          <div>
                            <label className="block mb-1.5 font-medium text-slate-400">Email Address</label>
                            <input type="email" required value={contactEmail} onChange={(e) => setContactEmail(e.target.value)} placeholder="email@domain.com" className={`w-full px-3 py-2.5 rounded-lg border outline-none ${darkMode ? 'bg-slate-950 border-slate-800 text-slate-100' : 'bg-white border-slate-300 text-slate-900'}`} />
                          </div>
                        </div>
                        <div>
                          <label className="block mb-1.5 font-medium text-slate-400">Subject</label>
                          <input type="text" required value={contactSubject} onChange={(e) => setContactSubject(e.target.value)} placeholder="Subject" className={`w-full px-3 py-2.5 rounded-lg border outline-none ${darkMode ? 'bg-slate-950 border-slate-800 text-slate-100' : 'bg-white border-slate-300 text-slate-900'}`} />
                        </div>
                        <div>
                          <label className="block mb-1.5 font-medium text-slate-400">Message</label>
                          <textarea rows="4" required value={contactMessage} onChange={(e) => setContactMessage(e.target.value)} placeholder="Message..." className={`w-full px-3 py-2.5 rounded-lg border outline-none ${darkMode ? 'bg-slate-950 border-slate-800 text-slate-100' : 'bg-white border-slate-300 text-slate-900'}`}></textarea>
                        </div>
                        <button type="submit" className="w-full py-3 rounded-lg font-bold text-xs bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white shadow-md flex items-center justify-center gap-2">
                          <Icon name="send" className="w-3.5 h-3.5" />
                          <span>Transmit Direct Message</span>
                        </button>
                      </form>
                    )}
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Footer */}
          <footer className={`py-8 border-t text-xs ${darkMode ? 'border-slate-900 bg-slate-950 text-slate-500' : 'border-slate-200 bg-slate-100 text-slate-600'}`}>
            <div className="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>© {new Date().getFullYear()} Muhammad Daud Ali Lashari. CEO & Founder at Zepra Tech.</div>
              <div className="flex items-center gap-4">
                <a href="https://gozepra.tech" target="_blank" rel="noreferrer" className="hover:text-cyan-400">gozepra.tech</a>
                <span>•</span>
                <a href="https://www.linkedin.com/in/muhammad-daud-ali-lashari-1302a5337/" target="_blank" rel="noreferrer" className="hover:text-cyan-400">LinkedIn Profile</a>
                <span>•</span>
                <a href="#hero" className="hover:text-cyan-400">Back to top ↑</a>
              </div>
            </div>
          </footer>

          {/* CV Modal */}
          {showResumeModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md overflow-y-auto">
              <div className={`relative w-full max-w-3xl my-8 rounded-2xl p-6 sm:p-8 border shadow-2xl print-page ${darkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-900'}`}>
                <div className="flex items-center justify-between border-b pb-4 mb-6 border-slate-800 no-print">
                  <div className="flex items-center gap-2">
                    <Icon name="fileText" className="w-5 h-5 text-cyan-400" />
                    <h4 className="font-bold text-base">Executive Curriculum Vitae</h4>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => window.print()} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold bg-cyan-500 hover:bg-cyan-400 text-slate-950">
                      <Icon name="printer" className="w-3.5 h-3.5" />
                      <span>Print / PDF</span>
                    </button>
                    <button onClick={() => setShowResumeModal(false)} className="p-1.5 rounded-lg text-slate-400 hover:text-white">
                      <Icon name="x" className="w-5 h-5" />
                    </button>
                  </div>
                </div>

                <div className="space-y-4 text-xs text-slate-300">
                  <div className="border-b border-slate-800 pb-3">
                    <h2 className="text-xl font-bold text-white">MUHAMMAD DAUD ALI LASHARI</h2>
                    <p className="text-cyan-400 font-semibold">Founder & CEO @ Zepra Tech • Top 5 Finalist @ 4th AEIF AI Showdown 2026</p>
                    <p className="text-slate-400 mt-1">DHA Phase 8, Lahore & Andover, MA | daudalilashari@gmail.com | gozepra.tech</p>
                  </div>
                  <div>
                    <h5 className="font-bold text-sm text-cyan-400 mb-1">Executive Summary</h5>
                    <p className="leading-relaxed">Full-stack systems architect and entrepreneur with proven execution across modern web platforms, real-time scoping calculators, and GEO/AEO search optimization.</p>
                  </div>
                  <div>
                    <h5 className="font-bold text-sm text-amber-400 mb-1">Featured Recognitions</h5>
                    <ul className="list-disc list-inside space-y-1">
                      <li><strong>Top 5 Global Finalist:</strong> 4th International AEIF AI Showdown 2026 at FAST-NUCES Lahore.</li>
                      <li><strong>Civic Innovation Hackathon 2026:</strong> Architected Lahore Pulse AI urban mobility & AQI engine.</li>
                      <li><strong>FAST-NUCES SOFTEC 2026:</strong> Web Development Team Lead for Zepra Tech.</li>
                    </ul>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Command Palette */}
          {commandPaletteOpen && (
            <div className="fixed inset-0 z-50 flex items-start justify-center pt-20 px-4 bg-slate-950/80 backdrop-blur-md" onClick={() => setCommandPaletteOpen(false)}>
              <div className={`relative w-full max-w-xl rounded-2xl border shadow-2xl overflow-hidden ${darkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-900'}`} onClick={(e) => e.stopPropagation()}>
                <div className="flex items-center px-4 py-3 border-b border-slate-800">
                  <Icon name="search" className="w-4 h-4 text-cyan-400 mr-3" />
                  <input type="text" autoFocus placeholder="Type a command or jump to section..." value={paletteSearch} onChange={(e) => setPaletteSearch(e.target.value)} className="w-full bg-transparent outline-none text-sm" />
                </div>
                <div className="max-h-72 overflow-y-auto p-2 space-y-1 text-xs">
                  {filteredPaletteItems.map((item, idx) => (
                    <button key={idx} onClick={item.action} className={`w-full text-left px-3 py-2.5 rounded-lg flex items-center justify-between ${darkMode ? 'hover:bg-slate-800 text-slate-200' : 'hover:bg-slate-100 text-slate-800'}`}>
                      <span>{item.title}</span>
                      <span className="text-[10px] uppercase font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-400">{item.category}</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PortfolioApp />);
  </script>
</body>
</html>
